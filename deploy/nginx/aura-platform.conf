# Nginx reverse-proxy config for both apps on a single EC2 instance.
#
# Layout (4 processes, all bound to 127.0.0.1 only — nginx is the only
# public-facing thing on the box):
#   127.0.0.1:3000  main platform frontend   (npm run start, apps/frontend)
#   127.0.0.1:8000  main platform backend    (uvicorn, apps/app)
#   127.0.0.1:3010  spotify-aura frontend
#   127.0.0.1:8010  spotify-aura backend     — MUST be public: Spotify's own
#                   redirect after OAuth consent hits this directly, it is
#                   never proxied through the Next.js frontend.
#
# Hostnames below are already set for your EC2 instance's public IP
# (13.217.12.111) via nip.io — free wildcard DNS, no registrar/signup
# needed, resolves automatically. If this instance ever gets a new public
# IP (e.g. it's not an Elastic/static IP and you stop/start it), regenerate
# these hostnames with the new IP and re-run certbot. Swap in a real domain
# later if you get one — same steps, just replace the nip.io hostnames.
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d app.13.217.12.111.nip.io -d api.13.217.12.111.nip.io \
#                        -d aura.13.217.12.111.nip.io -d aura-api.13.217.12.111.nip.io
# Certbot rewrites this file in place to add the HTTPS server blocks and the
# HTTP->HTTPS redirect — don't hand-write the SSL directives yourself.
#
# Install: copy this file to /etc/nginx/sites-available/aura-platform,
# symlink into sites-enabled, `sudo nginx -t`, `sudo systemctl reload nginx`.

# Connection "upgrade" only when the client actually asked for a protocol
# upgrade (websockets — e.g. Next.js dev-mode HMR); otherwise "close". A bare
# `proxy_set_header Connection "";` (as this file used to have) disables
# websocket upgrades entirely, since nginx needs Connection: upgrade +
# Upgrade: <protocol> to proxy the handshake at all.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Common proxy settings, shared by every location block below.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# Claude calls (analyze, chat, catalog/experience-track) can genuinely take
# tens of seconds — nginx's 60s default read timeout is too tight for those.
proxy_read_timeout 120s;
proxy_send_timeout 120s;

# ── Main platform — dashboard ──────────────────────────────────────────────
server {
    listen 80;
    server_name app.13.217.12.111.nip.io;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

# ── Main platform — FastAPI backend (Swagger/docs + direct API access) ─────
server {
    listen 80;
    server_name api.13.217.12.111.nip.io;

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}

# ── Spotify Aura — frontend ─────────────────────────────────────────────────
server {
    listen 80;
    server_name aura.13.217.12.111.nip.io;

    location / {
        proxy_pass http://127.0.0.1:3010;
    }
}

# ── Spotify Aura — backend (Spotify's OAuth redirect lands here directly) ──
server {
    listen 80;
    server_name aura-api.13.217.12.111.nip.io;

    location / {
        proxy_pass http://127.0.0.1:8010;
    }
}
