[project]
name = "spotify-aura-backend"
version = "0.1.0"
description = "Standalone AI Discovery Companion MVP — real Spotify catalog + Claude reasoning."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "loguru>=0.7.2",
    "tenacity>=9.0.0",
    "sqlalchemy>=2.0.35",
    "greenlet>=3.0",
    "aiosqlite>=0.20.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "email-validator>=2.2.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.companion", "app.auth", "app.spotify_connect", "app.memories"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
